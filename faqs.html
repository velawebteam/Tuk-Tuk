    <script data-static-ld="true" data-static-path="/faqs" type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Are the tours really private?","acceptedAnswer":{"@type":"Answer","text":"Yes! This is our main differentiator. When booking with Tavira Roots, the vehicle (Tuk Tuk or Jeep) and the guide will be exclusively focused on your group. We do not mix people from different groups."}},{"@type":"Question","name":"What is the maximum capacity of each vehicle?","acceptedAnswer":{"@type":"Answer","text":"Our Tuk Tuks take up to 9 people (across two vehicles with 5 and 4 seats). Jeeps have capacity for 5 people comfortably. If your group is larger, we can take multiple vehicles together."}},{"@type":"Question","name":"Do the tours include factory visits?","acceptedAnswer":{"@type":"Answer","text":"Yes, depending on the chosen tour. We have partnerships with chocolate, olive, salt pan, and ceramic shops. Visiting time and tastings vary according to the itinerary."}},{"@type":"Question","name":"What languages does the guide speak?","acceptedAnswer":{"@type":"Answer","text":"Our guides are fluent in Portuguese and English. Upon prior request and availability, we may have guides who speak French or Spanish."}},{"@type":"Question","name":"Do children pay the same price?","acceptedAnswer":{"@type":"Answer","text":"Children up to 3 years old travel for free (on lap). For children between 4 and 12 years old, we have special prices on certain tours. Check the details for each tour."}},{"@type":"Question","name":"Can we customize the itinerary?","acceptedAnswer":{"@type":"Answer","text":"Since the tours are private, we have some flexibility. If there's a specific point in Tavira you really want to see, talk to your guide at the start of the tour and we'll try to adapt the route."}},{"@type":"Question","name":"What is the best Tuk Tuk tour in Tavira?","acceptedAnswer":{"@type":"Answer","text":"Our \"Tavira Total\" tour is the most popular, as it combines the history of the historic center, a visit to the traditional salt pans, and the Ria Formosa area in one complete private route."}},{"@type":"Question","name":"What to do in Tavira in 1 day?","acceptedAnswer":{"@type":"Answer","text":"If you only have one day to visit Tavira, the best way to see the main points of interest is through an organized route combining the historic center, Santa Luzia, and the Ria Formosa, allowing you to make the most of your time."}},{"@type":"Question","name":"Where to see the sunset in Tavira?","acceptedAnswer":{"@type":"Answer","text":"The best sunset in Tavira is from the top of the Castle or in Cacela Velha. Our late afternoon jeep tours usually include strategic stops at these panoramic spots for a magical experience."}},{"@type":"Question","name":"Is Tavira Roots pet-friendly?","acceptedAnswer":{"@type":"Answer","text":"Yes! Since our tours are private, your pets are welcome in the Tuk Tuk or Jeep. We just ask that you inform us at the time of booking."}},{"@type":"Question","name":"How long does a Tuk Tuk tour in Tavira last?","acceptedAnswer":{"@type":"Answer","text":"We have tours ranging from 1:15h (city essentials) to full-day experiences of 6:30 hours that include lunch and boat trips."}},{"@type":"Question","name":"Where are the Tavira salt pans located?","acceptedAnswer":{"@type":"Answer","text":"The Tavira salt pans are located in the heart of the Ria Formosa Natural Park. In our tours, we visit traditional salt pans where you can see the extraction of Fleur de Sel and observe flamingos in the wild."}}]}</script>
